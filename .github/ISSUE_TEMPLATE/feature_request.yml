name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you were in and what was missing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Genned help? Rough ideas are fine.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Anything to keep in mind?
      description: |
        Genned runs fully offline and never uploads anything. If your idea needs the internet or
        extra permissions, say why it's worth it, or how it could work without.
