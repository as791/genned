name: Phase 3 train (CPU)

# Fine-tunes one of the app's models for Phase 3 (internal-docs/MODEL.md: everyday-edit
# augmentation + universal adversarial training) on GitHub's free CPU runners, no GPU.
# Each job is capped at about 6 h, so a model that needs longer is trained in up to 5
# chained jobs that hand over a saved training state. Measured on 4 vCPUs with the round 4
# recipe (edit consistency on): Community Forensics 1.6 img/s, so its defaults (4,000 +
# 1,000 images per class, 2,000 phone photos, 5 epochs) need 3 jobs. EfficientNet-B4 is
# several times slower (~0.6 img/s before edit consistency): use 5 jobs and fewer epochs.
# A run that stopped early (crash, time) can be continued with resume_run_id.
# The checkpoint lands in artifact phase3-<model>-checkpoint; pass this run's id to
# Ensemble build (checkpoint_run_id) to build and benchmark it.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to fine-tune
        type: choice
        options: [commfor, bundled]
        default: commfor
      objective:
        description: Training objective (tools/adv_finetune.py)
        type: choice
        options: [aug+uat, aug, uat]
        default: aug+uat
      openfake_per_class:
        description: Training images per class from OpenFake train (open-weights generators only)
        default: '4000'
      defactify_per_class:
        description: Training images per class from Defactify train
        default: '1000'
      epochs:
        description: Epochs
        default: '5'
      phone_real:
        description: Real phone photos (LAION-Mobile train shards) added as real examples; 0 = none
        default: '2000'
      edit_weights:
        description: Everyday edits drawn more often (tools/adv_finetune.py --edit-weights); empty = even
        default: 'grain=3,sharpen=3,screenshot=2,chain_shot=2'
      edit_consistency:
        description: Weight of the edit-consistency loss; 0 = off (on costs about 1.5x training time)
        default: '1'
      jobs:
        description: Chained 6-hour jobs (3 for the round 4 defaults; a job is skipped once training has finished)
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
      resume_run_id:
        description: Continue the saved training state of this earlier run (same model and settings); empty = start fresh
        default: ''

permissions:
  contents: read
  actions: read   # download the training state of an earlier run (resume_run_id)

jobs:
  train-1:
    uses: ./.github/workflows/phase3-train-job.yml
    secrets: inherit
    with:
      model: ${{ inputs.model }}
      objective: ${{ inputs.objective }}
      openfake_per_class: ${{ inputs.openfake_per_class }}
      defactify_per_class: ${{ inputs.defactify_per_class }}
      epochs: ${{ inputs.epochs }}
      phone_real: ${{ inputs.phone_real }}
      edit_weights: ${{ inputs.edit_weights }}
      edit_consistency: ${{ inputs.edit_consistency }}
      resume_run_id: ${{ inputs.resume_run_id }}

  train-2:
    needs: train-1
    if: inputs.jobs != '1' && needs.train-1.outputs.finished != 'true'
    uses: ./.github/workflows/phase3-train-job.yml
    secrets: inherit
    with:
      model: ${{ inputs.model }}
      objective: ${{ inputs.objective }}
      openfake_per_class: ${{ inputs.openfake_per_class }}
      defactify_per_class: ${{ inputs.defactify_per_class }}
      epochs: ${{ inputs.epochs }}
      phone_real: ${{ inputs.phone_real }}
      edit_weights: ${{ inputs.edit_weights }}
      edit_consistency: ${{ inputs.edit_consistency }}
      resume: true

  train-3:
    needs: train-2
    if: contains(fromJSON('["3","4","5"]'), inputs.jobs) && needs.train-2.outputs.finished != 'true'
    uses: ./.github/workflows/phase3-train-job.yml
    secrets: inherit
    with:
      model: ${{ inputs.model }}
      objective: ${{ inputs.objective }}
      openfake_per_class: ${{ inputs.openfake_per_class }}
      defactify_per_class: ${{ inputs.defactify_per_class }}
      epochs: ${{ inputs.epochs }}
      phone_real: ${{ inputs.phone_real }}
      edit_weights: ${{ inputs.edit_weights }}
      edit_consistency: ${{ inputs.edit_consistency }}
      resume: true

  train-4:
    needs: train-3
    if: contains(fromJSON('["4","5"]'), inputs.jobs) && needs.train-3.outputs.finished != 'true'
    uses: ./.github/workflows/phase3-train-job.yml
    secrets: inherit
    with:
      model: ${{ inputs.model }}
      objective: ${{ inputs.objective }}
      openfake_per_class: ${{ inputs.openfake_per_class }}
      defactify_per_class: ${{ inputs.defactify_per_class }}
      epochs: ${{ inputs.epochs }}
      phone_real: ${{ inputs.phone_real }}
      edit_weights: ${{ inputs.edit_weights }}
      edit_consistency: ${{ inputs.edit_consistency }}
      resume: true

  train-5:
    needs: train-4
    if: contains(fromJSON('["5"]'), inputs.jobs) && needs.train-4.outputs.finished != 'true'
    uses: ./.github/workflows/phase3-train-job.yml
    secrets: inherit
    with:
      model: ${{ inputs.model }}
      objective: ${{ inputs.objective }}
      openfake_per_class: ${{ inputs.openfake_per_class }}
      defactify_per_class: ${{ inputs.defactify_per_class }}
      epochs: ${{ inputs.epochs }}
      phone_real: ${{ inputs.phone_real }}
      edit_weights: ${{ inputs.edit_weights }}
      edit_consistency: ${{ inputs.edit_consistency }}
      resume: true
