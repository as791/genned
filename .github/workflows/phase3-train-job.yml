name: Phase 3 train job

# One training job (<= 6 h on a 4-vCPU runner), called by phase3-train.yml. It fetches the
# training data, trains with a time limit, and uploads the best checkpoint plus a resumable
# state. With `resume`, it continues the state the previous job uploaded; with
# `resume_run_id`, the state an earlier run uploaded (e.g. a run that crashed part-way).
# The state is saved at every validation, so a crash costs at most one epoch.
# Images stay on the runner; only weights and numbers are uploaded.
on:
  workflow_call:
    inputs:
      model: {type: string, required: true}
      objective: {type: string, required: true}
      openfake_per_class: {type: string, required: true}
      defactify_per_class: {type: string, required: true}
      epochs: {type: string, required: true}
      phone_real: {type: string, default: '0'}
      video_frames: {type: string, default: '0'}
      edit_weights: {type: string, default: ''}
      edit_consistency: {type: string, default: '0'}
      resume: {type: boolean, default: false}
      resume_run_id: {type: string, default: ''}
    outputs:
      finished:
        description: "'true' when training reached its last step (or stopped on its own)"
        value: ${{ jobs.train.outputs.finished }}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read   # download the training state of an earlier run (resume_run_id)
    outputs:
      finished: ${{ steps.result.outputs.finished }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4

      - name: Note the job's start time
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # The runner image ships ~30 GB of SDKs this job doesn't need; the training images do.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "onnxruntime>=1.18,<2" "pillow>=10,<12" "numpy>=1.26,<3" "datasets>=2.19,<5" \
            "timm>=1.0,<2" "huggingface_hub>=0.23,<1"

      # Proprietary generators are never trained on (their OpenFake subsets are
      # non-commercial and the weights ship in the app); the benchmarks still test on them.
      - name: Fetch training and validation data
        env:
          OPENFAKE_PER_CLASS: ${{ inputs.openfake_per_class }}
          DEFACTIFY_PER_CLASS: ${{ inputs.defactify_per_class }}
          PHONE_REAL: ${{ inputs.phone_real }}
          VIDEO_FRAMES: ${{ inputs.video_frames }}
        run: |
          PROPRIETARY="midjourney|dall-?e|gpt-image|imagen|ideogram|grok|recraft|seedream|nano-banana|mystic|veo|sora|kling|firefly|runway|luma|hailuo|ernie|seededit|gemini"
          fetch() {
            for attempt in 1 2 3 4 5 6; do
              python -u tools/fetch_eval_data.py "$@" --resume && return 0
              echo "Network trouble (attempt $attempt); resuming in 30 s"; sleep 30
            done
            return 1
          }
          # A source set to 0 is left out (a video-frame run uses none of the image sets).
          if [ "${OPENFAKE_PER_CLASS:-0}" -gt 0 ]; then
            fetch --dataset ComplexDataLab/OpenFake --config core --split train --strict-split \
              --out data/train/openfake --per-class "$OPENFAKE_PER_CLASS" \
              --label-col label --ai-values fake --real-values real --generator-col model \
              --exclude-generators "$PROPRIETARY" --max-per-generator 600 --max-scan 200000
            fetch --dataset ComplexDataLab/OpenFake --config core --split validation --strict-split \
              --out data/val/openfake --per-class 150 \
              --label-col label --ai-values fake --real-values real --generator-col model \
              --exclude-generators "$PROPRIETARY" --max-per-generator 15 --max-scan 20000
          fi
          if [ "${DEFACTIFY_PER_CLASS:-0}" -gt 0 ]; then
            fetch --dataset Rajarshi-Roy-research/Defactify_Image_Dataset --split train --strict-split \
              --out data/train/defactify --per-class "$DEFACTIFY_PER_CLASS" --max-scan 25000 \
              --label-col Label_A --ai-values 1 --real-values 0 \
              --generator-col Label_B --generator-names real,sd21,sdxl,sd3,dalle3,midjourney6 \
              --exclude-generators "$PROPRIETARY"
          fi
          # Real phone photos as extra real examples (LAION-Mobile; photos stay on the runner).
          # Training uses the "train" shards and model selection the "val" shards; the
          # benchmark's photos come from the "test" shards and are never fetched here.
          if [ "${PHONE_REAL:-0}" -gt 0 ]; then
            pip install -q "huggingface_hub>=0.23,<1"
            for attempt in 1 2 3; do
              rm -rf data/train/phone data/val/phone
              python -u tools/fetch_mds_photos.py --dataset sumathiselvan/LAION-Mobile-streaming \
                  --out data/train/phone --count "$PHONE_REAL" --split train --seed 4321 \
                && python -u tools/fetch_mds_photos.py --dataset sumathiselvan/LAION-Mobile-streaming \
                  --out data/val/phone --count 150 --split val --seed 8765 \
                && break
              echo "Phone photo fetch failed (attempt $attempt); retrying in 30 s"; sleep 30
              [ "$attempt" = 3 ] && { echo "::error::Could not fetch the phone photos"; exit 1; }
            done
          fi
          # Video frames (GenVideo; clips stay on the runner), sampled the way the app samples
          # a video. Only its open-weights generators are kept: the fetcher skips every other
          # one and fails if an excluded generator's folder appears. Training reads the
          # "train" shards and model selection the "val" shards.
          if [ "${VIDEO_FRAMES:-0}" -gt 0 ]; then
            pip install -q opencv-python-headless
            for attempt in 1 2 3; do
              rm -rf data/train/video data/val/video
              python -u tools/fetch_video_frames.py --out data/train/video \
                  --frames-per-class "$VIDEO_FRAMES" --split train --seed 4321 \
                && python -u tools/fetch_video_frames.py --out data/val/video \
                  --frames-per-class 150 --split val --seed 8765 \
                && break
              echo "Video frame fetch failed (attempt $attempt); retrying in 30 s"; sleep 30
              [ "$attempt" = 3 ] && { echo "::error::Could not fetch the video frames"; exit 1; }
            done
          fi
          # Fail loudly if a proprietary generator's images still reached the training data.
          # (The video folders are checked by their own fetcher: "opensora" is an open model
          # that the name list below would mistake for Sora.)
          if ls -d data/*/*/ai/*/ | grep -v '/video/' | grep -i -E "$PROPRIETARY"; then
            echo "::error::Proprietary-generator images found in the training data"; exit 1
          fi
          du -sh data/train/* data/val/*

      - name: Download the previous job's training state
        if: inputs.resume && inputs.resume_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: phase3-${{ inputs.model }}-state
          path: state

      - name: Download an earlier run's training state
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: phase3-${{ inputs.model }}-state
          path: state
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      # 3 compute threads + 2 data workers on 4 vCPUs: image decoding and edits cost about as
      # much CPU as the model itself.
      - name: Train
        id: train
        env:
          MODEL: ${{ inputs.model }}
          OBJECTIVE: ${{ inputs.objective }}
          EPOCHS: ${{ inputs.epochs }}
          PER_CLASS: ${{ inputs.openfake_per_class }}
          RESUME: ${{ inputs.resume || inputs.resume_run_id != '' }}
          DEFACTIFY_PER_CLASS: ${{ inputs.defactify_per_class }}
          PHONE_REAL: ${{ inputs.phone_real }}
          VIDEO_FRAMES: ${{ inputs.video_frames }}
          EDIT_WEIGHTS: ${{ inputs.edit_weights }}
          EDIT_CONSISTENCY: ${{ inputs.edit_consistency }}
        run: |
          set -o pipefail
          extra=()
          train_data=(); val_data=()
          [ "${PER_CLASS:-0}" -gt 0 ] && { train_data+=(data/train/openfake); val_data+=(data/val/openfake); }
          [ "${DEFACTIFY_PER_CLASS:-0}" -gt 0 ] && train_data+=(data/train/defactify)
          if [ "${VIDEO_FRAMES:-0}" -gt 0 ]; then
            train_data+=(data/train/video); val_data+=(data/val/video)
            # --per-class is a cap per folder: it must not cut the frames short.
            [ "$VIDEO_FRAMES" -gt "${PER_CLASS:-0}" ] && PER_CLASS="$VIDEO_FRAMES"
          fi
          [ "${#train_data[@]}" -gt 0 ] && [ "${#val_data[@]}" -gt 0 ] || { echo "::error::No training or validation data selected"; exit 1; }
          [ "$RESUME" = "true" ] && extra+=(--resume-state "state/$MODEL-state-p3.pt")
          [ "$MODEL" = "bundled" ] && extra+=(--batch-size 12)
          if [ "${PHONE_REAL:-0}" -gt 0 ]; then
            # A real-only folder: draw AI and real equally often so it doesn't tilt the model.
            train_data+=(data/train/phone); val_data+=(data/val/phone); extra+=(--balance-classes)
          fi
          [ -n "$EDIT_WEIGHTS" ] && extra+=(--edit-weights "$EDIT_WEIGHTS")
          [ "${EDIT_CONSISTENCY:-0}" != "0" ] && extra+=(--edit-consistency "$EDIT_CONSISTENCY")
          # The job is cut off at 355 min. Train for whatever is left after setup and data
          # fetching, minus 40 min for preparing the validation images, the last validation, saving and uploads.
          MAX_HOURS=$(python3 -c "import os,time; print(round(max(0.5, (355*60 - (time.time()-int(os.environ['JOB_STARTED'])) - 40*60)/3600), 2))")
          echo "Training time budget for this job: $MAX_HOURS h"
          python -u tools/adv_finetune.py --model "$MODEL" --objective "$OBJECTIVE" \
            --train-data "${train_data[@]}" --val-data "${val_data[@]}" \
            --per-class "$PER_CLASS" --val-per-class 150 --epochs "$EPOCHS" --evals-per-epoch 1 \
            --workers 2 --torch-threads 3 --max-hours "$MAX_HOURS" --save-state --tag p3 --out runs "${extra[@]}" \
            | tee runs-train.log

      - name: Result
        id: result
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          log = json.load(open(f"runs/{os.environ['MODEL']}-train-log-p3.json"))
          b = log["base"]
          print(f"### {log['model']} ({log['objective']}), job {log['jobs']}: step {log['step']}, "
                f"finished: {log['finished']}, stopped: {log['stopped']}\n")
          print("| Validation | Clean AUC | Clean acc | Edited AUC mean / min | Universal robust acc | Eligible |")
          print("|---|---|---|---|---|---|")
          print(f"| start | {b['clean_auc']:.3f} | {b['clean_acc']:.1%} | {b['edit_auc_mean']:.3f} / "
                f"{b['edit_auc_min']:.3f} | {b['uap_robust_acc_8']:.1%} | - |")
          for e in log["evaluations"]:
              print(f"| epoch {e['epoch']} | {e['clean_auc']:.3f} | {e['clean_acc']:.1%} | {e['edit_auc_mean']:.3f} / "
                    f"{e['edit_auc_min']:.3f} | {e['uap_robust_acc_8']:.1%} | {'yes' if e['eligible'] else 'no'} |")
          sel = log["selected"]
          print(f"\nSelected: {'epoch ' + str(sel['epoch']) if sel else 'none (no checkpoint met the clean gate)'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"finished={'true' if log['finished'] else 'false'}\n")
          PY

      # Both uploads below are tried a second time, five minutes later, if the artifact
      # service is unavailable: a lost upload costs the whole job's training.
      - name: Upload checkpoint and log (weights and numbers only)
        id: upload_checkpoint
        if: always() && steps.train.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ inputs.model }}-checkpoint
          path: |
            runs/*-robust-p3.pt
            runs/*-final-p3.pt
            runs/*-train-log-p3.json
            runs-train.log
          overwrite: true
          if-no-files-found: warn

      # A job whose training step failed keeps the earlier jobs' checkpoint artifact and
      # uploads its log under another name.
      - name: Upload the log of a failed training step
        if: always() && steps.train.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ inputs.model }}-failed-log
          path: runs-train.log
          overwrite: true
          if-no-files-found: warn

      # Also after a failed training step: the state saved at the last validation is newer
      # than the previous job's, and a later run can continue it (resume_run_id).
      - name: Upload training state (for the next job)
        id: upload_state
        if: always() && hashFiles('runs/*-state-p3.pt') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ inputs.model }}-state
          path: runs/*-state-p3.pt
          overwrite: true
          retention-days: 7

      - name: Wait before uploading again
        if: always() && (steps.upload_checkpoint.outcome == 'failure' || steps.upload_state.outcome == 'failure')
        run: sleep 300

      - name: Upload checkpoint and log again
        if: always() && steps.upload_checkpoint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ inputs.model }}-checkpoint
          path: |
            runs/*-robust-p3.pt
            runs/*-final-p3.pt
            runs/*-train-log-p3.json
            runs-train.log
          overwrite: true

      - name: Upload training state again
        if: always() && steps.upload_state.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ inputs.model }}-state
          path: runs/*-state-p3.pt
          overwrite: true
          retention-days: 7
