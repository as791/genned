name: C2PA probe

# One-off look at the contentauth/c2pa-android library before integrating it: how it can
# be fetched without credentials (JitPack / release AAR), its manifest (package, minSdk),
# native library sizes per ABI, and its public API. Prints facts only; builds nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of contentauth/c2pa-android (blank = latest)
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          url=https://api.github.com/repos/contentauth/c2pa-android/releases/latest
          [ -n "$TAG" ] && url=https://api.github.com/repos/contentauth/c2pa-android/releases/tags/$TAG
          curl -sSf -H "Authorization: Bearer $GH_TOKEN" "$url" > release.json
          python3 - <<'EOF'
          import json
          r = json.load(open("release.json"))
          print("tag:", r["tag_name"], "published:", r["published_at"])
          for a in r["assets"]:
              print(f"  {a['name']}  {a['size'] / 1e6:.1f} MB  {a['browser_download_url']}")
          open("tag.txt", "w").write(r["tag_name"])
          aar = [a["browser_download_url"] for a in r["assets"] if a["name"].endswith(".aar")]
          open("aar_url.txt", "w").write(aar[0] if aar else "")
          EOF

      - name: JitPack
        run: |
          tag="$(cat tag.txt)"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o jitpack.pom -w '%{http_code}' --max-time 300 \
              "https://jitpack.io/com/github/contentauth/c2pa-android/$tag/c2pa-android-$tag.pom" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = 200 ] && break
            sleep 60
          done
          [ -f jitpack.pom ] && head -c 3000 jitpack.pom; echo
          curl -s --max-time 120 "https://jitpack.io/com/github/contentauth/c2pa-android/$tag/build.log" | tail -40 || true

      - name: Inspect the AAR
        run: |
          set -euo pipefail
          url="$(cat aar_url.txt)"
          if [ -z "$url" ]; then echo "::error::no .aar asset on the release"; exit 1; fi
          curl -sSfL -o c2pa.aar "$url"
          ls -l c2pa.aar
          mkdir aar && cd aar && unzip -q ../c2pa.aar
          echo "== AndroidManifest.xml"; cat AndroidManifest.xml
          echo "== native libraries"; find jni -name '*.so' -exec ls -l {} \; | awk '{printf "%10.1f MB  %s\n", $5/1e6, $9}'
          echo "== compressed size per ABI (zip -9, roughly what the APK adds)"
          for d in jni/*/; do (cd "$d" && zip -q -9 -r /tmp/abi.zip . && ls -l /tmp/abi.zip | awk -v d="$d" '{printf "%10.1f MB  %s\n", $5/1e6, d}' && rm /tmp/abi.zip); done
          echo "== other entries"; find . -maxdepth 1 -type f | sort
          [ -f proguard.txt ] && { echo "== proguard.txt"; cat proguard.txt; }
          echo "== public API"
          mkdir classes && (cd classes && unzip -q ../classes.jar)
          find classes -name '*.class' ! -name '*$*' | sed 's|^classes/||; s|\.class$||; s|/|.|g' | sort > classlist.txt
          wc -l classlist.txt
          javap -public -cp classes.jar $(cat classlist.txt) 2>/dev/null | grep -v '^Compiled from' | head -400 || true
          echo "== strings mentioning trust / settings / validation"
          javap -public -cp classes.jar $(cat classlist.txt) 2>/dev/null | grep -iE 'trust|setting|valid|verify|status' | sort -u | head -80 || true

  # Test fixtures for the app's manifest interpreter: c2patool (same c2pa-rs core as the
  # Android library) signs a test image with its sample certificate, and reads each case
  # with and without that certificate as a trust anchor. Also fetches the public trust lists.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install c2patool
        run: cargo install c2patool --locked 2>&1 | tail -3 && c2patool --version
      - name: Sample keys and an image
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/contentauth/c2pa-rs src
          img=$(find src -name earth_apollo17.jpg | head -1); [ -n "$img" ] || img=$(find src -name '*.jpg' -size +20k | head -1)
          echo "base image: $img"; cp "$img" base.jpg
          # A throwaway test CA (the trust anchor) and a C2PA signing certificate it issues.
          openssl ecparam -name prime256v1 -genkey -noout -out root.key
          openssl req -x509 -new -key root.key -sha256 -days 3650 -subj "/CN=Genned Test Root/O=Genned Test" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" -out anchor.pem
          openssl ecparam -name prime256v1 -genkey -noout -out es256_private.key
          openssl req -new -key es256_private.key -subj "/CN=Genned Test Signer/O=Genned Test" -out leaf.csr
          printf "basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=emailProtection\n" > leaf.ext
          openssl x509 -req -in leaf.csr -CA anchor.pem -CAkey root.key -CAcreateserial -days 3650 -sha256 \
            -extfile leaf.ext -out leaf.pem
          cat leaf.pem > es256_certs.pem
          openssl x509 -in leaf.pem -noout -subject -issuer
          python3 - <<'PY'
          import json
          anchor = open("anchor.pem").read()
          json.dump({"verify": {"verify_trust": True, "remote_manifest_fetch": False}, "trust": {"trust_anchors": anchor}},
                    open("trusted.json", "w"))
          json.dump({"verify": {"verify_trust": True, "remote_manifest_fetch": False}}, open("untrusted.json", "w"))
          def manifest(source, agent):
              return {"alg": "es256", "private_key": "es256_private.key", "sign_cert": "es256_certs.pem",
                      "claim_generator_info": [{"name": "genned-fixture", "version": "1.0"}],
                      "assertions": [{"label": "c2pa.actions", "data": {"actions": [
                          {"action": "c2pa.created", "softwareAgent": {"name": agent},
                           "digitalSourceType": "http://cv.iptc.org/newscodes/digitalsourcetype/" + source}]}}]}
          json.dump(manifest("trainedAlgorithmicMedia", "TestGen"), open("m_ai.json", "w"))
          json.dump(manifest("digitalCapture", "TestCamera"), open("m_capture.json", "w"))
          json.dump(manifest("compositeWithTrainedAlgorithmicMedia", "TestEditor"), open("m_composite.json", "w"))
          PY
      - name: Sign and read
        run: |
          set -uo pipefail
          for m in ai capture composite; do c2patool base.jpg -m m_$m.json -o $m.jpg -f > /dev/null && echo "signed $m"; done
          # Tampered: change bytes in the image data after signing.
          python3 -c "d=bytearray(open('ai.jpg','rb').read()); n=len(d)-2000; d[n:n+50]=bytes(50); open('tampered.jpg','wb').write(d)"
          for f in ai capture composite tampered base; do
            for s in untrusted trusted; do
              echo "===== FIXTURE $f $s"
              c2patool --settings $s.json $f.jpg 2>&1 | head -c 20000 || true
              echo
            done
          done
      - name: Public trust lists
        if: always()
        run: |
          for u in https://raw.githubusercontent.com/c2pa-org/conformance-public/main/trust-list/C2PA-TRUST-LIST.pem \
                   https://contentcredentials.org/trust/anchors.pem \
                   https://contentcredentials.org/trust/allowed.pem \
                   https://contentcredentials.org/trust/store.cfg; do
            f=$(basename "$u")
            code=$(curl -sSL -o "$f" -w '%{http_code}' "$u" || true)
            echo "== $u -> HTTP $code, $(wc -c < "$f" 2>/dev/null) bytes, $(grep -c 'BEGIN CERT' "$f" 2>/dev/null) certs"
            if grep -q 'BEGIN CERT' "$f" 2>/dev/null; then
              awk '/BEGIN CERT/{n++} {print > ("tl_" n ".pem")}' "$f"
              for c in tl_*.pem; do openssl x509 -in "$c" -noout -subject 2>/dev/null; done | sed 's/^/   /'
              rm -f tl_*.pem
            else
              head -c 1500 "$f"; echo
            fi
          done
          echo "== FULL anchors.pem BEGIN"; cat anchors.pem; echo "== FULL anchors.pem END"
          for c in $(awk '/BEGIN CERT/{n++} {print > ("itl_" n ".pem")}' anchors.pem; ls itl_*.pem); do openssl x509 -in "$c" -noout -subject -enddate 2>/dev/null | tr '\n' ' '; echo; done
          echo "== sha256"; sha256sum C2PA-TRUST-LIST.pem anchors.pem allowed.pem store.cfg 2>/dev/null || true
