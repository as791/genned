name: Android CI

# Runs on GitHub's hosted runners, which have normal internet access to
# dl.google.com/maven.google.com. This workflow is the actual build/test gate
# for the project. Pushing a tag vMAJOR.MINOR.PATCH also publishes the signed
# release APK as a GitHub release (README "Publishing a release").
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used by the tag-only "Publish GitHub release" step
    steps:
      - uses: actions/checkout@v4

      # Every CI build gets a higher versionCode than the last, so any of them installs as
      # an update (app/build.gradle.kts reads GENNED_VERSION_CODE). Release tags run in this
      # same workflow, so they share its run counter. A tag also sets versionName.
      - name: Version
        run: |
          echo "GENNED_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag $GITHUB_REF_NAME must look like v1.2.3"
              exit 1
            fi
            echo "GENNED_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Not android-actions/setup-android@v3: it unconditionally runs
      # `sdkmanager tools`, and Google has fully removed that legacy package
      # from the SDK repository, so the action now crashes on every runner
      # before any Gradle step gets to run. Search for a preinstalled SDK
      # first (an earlier crash trace showed one at
      # /usr/local/lib/android/sdk on this runner image, but that path isn't
      # guaranteed and $ANDROID_HOME wasn't set for this step), falling back
      # to downloading cmdline-tools directly so this doesn't depend on
      # unstated runner-image internals either way.
      - name: Set up Android SDK
        run: |
          : "${ANDROID_SDK_ROOT:=${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -maxdepth 4 -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | sort -V | tail -1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "No cmdline-tools found under $ANDROID_SDK_ROOT - downloading them"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -fsSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests (domain + app)
        run: ./gradlew testDebugUnitTest :domain:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: genned-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # The Room schema is generated by the build (ksp room.schemaLocation). Once it's
      # committed, any schema change without a version bump + migration fails here.
      - name: Room schema is committed and unchanged
        run: |
          if git ls-files --error-unmatch app/schemas >/dev/null 2>&1; then
            git status --porcelain app/schemas
            git diff --exit-code app/schemas
            test -z "$(git status --porcelain app/schemas)"
          else
            echo "::warning::app/schemas is not committed yet; uploading the generated schema as an artifact."
            find app/schemas -name '*.json' -print -exec cat {} \;
          fi

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/

      # Release builds use a private upload key that is never committed. It comes from
      # repository secrets (README "Release builds"); without them the release build is
      # still produced, unsigned, so R8 and resource shrinking are exercised on every push.
      - name: Prepare upload key (if configured)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "GENNED_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release builds will be signed with the upload key."
          else
            echo "No UPLOAD_KEYSTORE_BASE64 secret: release builds stay unsigned."
          fi

      - name: Release build (lint, R8, resource shrinking)
        env:
          GENNED_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          GENNED_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          GENNED_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew lintRelease assembleRelease bundleRelease --stacktrace

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: genned-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

      # Tag builds only: publish the signed APK (what people install) and its checksum.
      # The AAB and mapping.txt stay in the genned-release artifact above.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed release APK. Releases need the upload-key secrets (README \"Release builds\")."
            exit 1
          fi
          APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          CERT_SHA256="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | sed 's/.*digest: //')"
          NAME="genned-$GENNED_VERSION_NAME.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > SHA256SUMS.txt)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Genned $GENNED_VERSION_NAME: checks on your phone whether an image or video (Reels, Shorts) is likely AI-generated. Android 8.0 or newer.

          > This is an estimate, not proof. See "Known accuracy limitations" in the README.

          ## Install
          1. On your phone, download **$NAME** below and open it.
          2. Android asks you to allow installs from your browser or Files app ("Install unknown apps"). Allow it for that app, then tap Install.
          3. If you installed a test build signed with a different key, uninstall it first: Android only updates an app with one signed by the same key.

          ## Updates
          Genned has no internet permission, so it can't check for updates itself. To hear about new versions, use Watch → Custom → Releases on the repository. Install a newer APK over the old one; your history is kept.

          ## Verify (optional)
          - APK SHA-256: in SHA256SUMS.txt.
          - Signing certificate SHA-256: \`$CERT_SHA256\`. Every Genned release is signed with this certificate.

          ## Privacy
          Everything is analyzed on your phone. Images, videos and screen captures are never uploaded. There are no accounts, ads or analytics.

          Build: versionCode $GENNED_VERSION_CODE, commit $GITHUB_SHA.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Genned $GENNED_VERSION_NAME" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            domain/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
