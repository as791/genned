name: Website

# Publishes site/ as the project website on GitHub Pages (https://as791.github.io/genned/).
# tools/build_site.py fills in the latest release (version, APK links and sizes), renders
# PRIVACY.md as privacy.html, and adds the app screens from the "screens" artifact of the
# latest green Android CI run on main. The built site is force-pushed as a single commit to
# the gh-pages branch, which Pages serves (Settings > Pages > Deploy from a branch:
# gh-pages, / (root)). It runs after every green Android CI run on main (so a new release
# or changed screens update the site), when the site itself changes, or by hand.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'PRIVACY.md'
      - 'tools/build_site.py'
      - '.github/workflows/site.yml'
  workflow_run:
    workflows: ['Android CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push the built site to gh-pages
  actions: read     # download the screens artifact from Android CI

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install "markdown>=3.5,<4" "pillow>=10,<12"
      - name: Latest release and app screens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,url,publishedAt,assets > release.json
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-ci.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Release: $(jq -r .tagName release.json); app screens from Android CI run $RUN"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name screens --dir screens
      - name: Build
        run: python tools/build_site.py --screens screens --release release.json --out _site
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Website built from ${GITHUB_SHA::7} ($(jq -r .tagName ../release.json))"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to gh-pages. Site: https://as791.github.io/genned/"
